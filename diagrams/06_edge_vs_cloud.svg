<text xml:space="preserve" text-anchor="start" x="93.62" y="-241.2" font-family="Segoe UI" font-weight="bold" font-size="14.00" fill="#eb6834">EDGE (plant gateway)</text>
<text xml:space="preserve" text-anchor="start" x="13" y="-212" font-family="Segoe UI" font-size="11.00">• High&#45;frequency vibration processing (2 kHz &#45;&gt; 42 features/s)</text>
<text xml:space="preserve" text-anchor="start" x="13" y="-187" font-family="Segoe UI" font-size="11.00">• Immediate alarms &amp; interlocks (&lt; 100 ms)</text>
<text xml:space="preserve" text-anchor="start" x="13" y="-162" font-family="Segoe UI" font-size="11.00">• Local machine protection (spindle overload stop)</text>
<text xml:space="preserve" text-anchor="start" x="13" y="-137" font-family="Segoe UI" font-size="11.00">• Noise filtering &amp; data&#45;quality checks</text>
<text xml:space="preserve" text-anchor="start" x="13" y="-112" font-family="Segoe UI" font-size="11.00">• Protocol conversion OPC UA / FOCAS &#45;&gt; MQTT</text>
<text xml:space="preserve" text-anchor="start" x="13" y="-87" font-family="Segoe UI" font-size="11.00">• Aggregation &amp; batching (1 msg / machine&#45;second)</text>
<text xml:space="preserve" text-anchor="start" x="13" y="-62" font-family="Segoe UI" font-size="11.00">• Store&#45;and&#45;forward during WAN outage (7 days)</text>
<text xml:space="preserve" text-anchor="start" x="13" y="-37" font-family="Segoe UI" font-size="11.00">• Local HMI / plant Grafana</text>
<text xml:space="preserve" text-anchor="start" x="13" y="-12" font-family="Segoe UI" font-size="11.00">• Model inference at the edge (Isolation Forest)</text>
</g>
